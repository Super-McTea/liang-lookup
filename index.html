<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Liang Lookup Tool</title>
        <meta property="description" content="A tool for looking up words in the Liang conlang">
        <meta property="theme-color" content="#ffebcd">

        <meta property="og:image" content="https://raw.githubusercontent.com/Super-McTea/super-mctea.github.io/refs/heads/main/assets/images/liang-lookup/icon.png">

        <link rel="icon" href="assets/icon.png">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div id="container">

            <!-- <header class="header box" id="header">
            </header> -->

            <div class="filters box">
                <div id="searchbar-container">
                    <div class="search-bar">
                        <input type="text" id="search-bar" value="" placeholder="Enter search term here...">
                    </div>
                    <p id="search-error" class="error">Error Message Here</p>
                </div>
                <div class="under-bar">
                    <p>Sort</p>
                    <label for="length-sort-box" class="sort-button">
                        Length
                        <input type="checkbox" name="length-sort" id="length-sort-box">
                    </label>
                    <label for="type-filter">
                        Filter by:
                        <select name="type-filter" id="type-filter">
                            <option value="" selected>All</option>
                            <option value="noun">Nouns</option>
                            <option value="proper">Proper Nouns</option>
                            <option value="verb">Verbs</option>
                            <option value="adjective">Adjectives</option>
                            <option value="genitive">Genitives</option>
                            <option value="adverb">Adverbs</option>
                            <option value="exclamation">Exclamations</option>
                            <option value="auxillary">Auxillary Verbs</option>
                            <option value="determiner">Determiners</option>
                            <option value="prefix">Prefixes</option>
                            <option value="suffix">Suffixes</option>
                            <option value="postposition">Postpositionals</option>
                            <option value="compound">Compounds</option>
                        </select>
                    </label>
                </div>
                <div id="filter-button-container">
                    <label class="filter-button">
                        <input type="radio" name="search-filter" id="word-box" checked="checked">
                        Words
                    </label>
                    <label class="filter-button">
                        <input type="radio" name="search-filter" id="number-box">
                        Numbers
                    </label>
                    <label class="filter-button">
                        <input type="radio" name="search-filter" id="alphabet-box">
                        Alphabet
                    </label>
                    <label class="filter-button">
                        <input type="radio" name="search-filter" id="grammar-box">
                        Grammar
                    </label>
                </div>
            </div>

            <div class="card-results box">
                <div id="card-container">
                    <!-- Cards go here! -->
                     <h1>Awaiting connection to database...</h1>
                </div>
            </div>

            <footer class="footer box">
                <div class="left">
                    Updated last: January 4th 2026
                </div>
                <div class="center">

                </div>
                <div class="right">
                    <a href="https://super-mctea.github.io">McTea's Portfolio</a>
                </div>
                </footer>
        </div>

        <div id="back-to-top">
            <div class="back-to-top-text">Back To Top</div>
        </div>

        <!-- <script src="js/wordData.js"></script> -->
        <!-- <script src="js/numberData.js"></script> -->
        <script src="js/grammarData.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
